// Dominacion en mapas pequenos del juego base sin bots, maximo 8 jugadores
set sv_hostname "MW3 LAN CHICO DOM sin bots"
set sv_maprotation "gametype dom map mp_dome map mp_bootleg map mp_village map mp_underground"
set g_gametype dom
set sv_maxclients 8
set g_password ""
set sv_privateClients 0
set sv_privatePassword ""
set rcon_password ""
set sv_voice 2
set g_allowVote 1
set g_deadChat 0
set g_inactivity 90
set sv_kickBanTime 300
set sv_floodProtect 1

// Sin bots (el mod sigue cargado pero no agrega ninguno)
set bots_manage_add 0
set bots_manage_fill 0
