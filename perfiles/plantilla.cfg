// Plantilla de perfil. Copiala como mw3_<nombre>.cfg (el prefijo mw3_ hace que perfiles.sh la instale)
// y edita solo lo que necesites. Guia: GUIA_CREAR_CONFIGS.md

set sv_hostname "MW3 LAN MI PERFIL"

// Rotacion: "gametype <modo> map <mapa> map <mapa> gametype <otro modo> map <mapa> ..."
set sv_maprotation "gametype war map mp_seatown map mp_dome map mp_bootleg"
set g_gametype war

// Jugadores
set sv_maxclients 16
set g_password ""

// Duracion y puntuacion (cambia "war" por el modo que uses)
set scr_war_timelimit 10
set scr_war_scorelimit 7500

// Bots: mantiene N jugadores en total (humanos + bots). Para sin bots deja fill en 0
set bots_manage_add 0
set bots_manage_fill 10
set bots_manage_fill_mode 0
set bots_manage_fill_kick 1
set bots_skill 0
